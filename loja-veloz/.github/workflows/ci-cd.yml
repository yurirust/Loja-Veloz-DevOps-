name: CI/CD — Loja Veloz

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/loja-veloz

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint e testes de todos os serviços
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Testes — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [pedidos, pagamentos, estoque]
        include:
          - service: pedidos
            path: services/pedidos
            lang: python
          - service: pagamentos
            path: services/pagamentos
            lang: python
          - service: estoque
            path: services/estoque
            lang: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      - name: Instalar dependências
        working-directory: ${{ matrix.path }}
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        working-directory: ${{ matrix.path }}
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__ || true

      - name: Testes unitários
        working-directory: ${{ matrix.path }}
        run: pytest --tb=short -q || true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Teste do API Gateway (Node.js)
  # ════════════════════════════════════════════════════════════════════════════
  test-gateway:
    name: 🧪 Testes — api-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - name: Instalar dependências
        working-directory: services/api-gateway
        run: npm ci
      - name: Lint
        working-directory: services/api-gateway
        run: npm run lint || true
      - name: Testes
        working-directory: services/api-gateway
        run: npm test || true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Build e push das imagens Docker
  # ════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, test-gateway]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api-gateway, pedidos, pagamentos, estoque]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy no Kubernetes
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy — Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    environment: production   # Requer aprovação manual no GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v3

      - name: Configurar kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Atualizar imagens com SHA do commit
        run: |
          IMAGE_TAG="main-$(echo ${{ github.sha }} | cut -c1-7)"
          for SVC in api-gateway pedidos pagamentos estoque; do
            kubectl set image deployment/${SVC} \
              ${SVC}=${{ env.IMAGE_PREFIX }}/${SVC}:${IMAGE_TAG} \
              -n loja-veloz
          done

      - name: Aguardar rollout
        run: |
          for SVC in api-gateway pedidos pagamentos estoque; do
            kubectl rollout status deployment/${SVC} -n loja-veloz --timeout=120s
          done

      - name: Verificar pods
        run: kubectl get pods -n loja-veloz

      - name: Rollback automático em falha
        if: failure()
        run: |
          echo "⚠️  Deploy falhou! Executando rollback..."
          for SVC in api-gateway pedidos pagamentos estoque; do
            kubectl rollout undo deployment/${SVC} -n loja-veloz
          done

apiVersion: v1
kind: Secret
metadata:
  name: loja-veloz-secrets
  namespace: loja-veloz
  labels:
    app.kubernetes.io/part-of: loja-veloz
  annotations:
    # Em produção: usar External Secrets Operator + AWS Secrets Manager / Vault
    kubernetes.io/description: "Credenciais sensíveis da Loja Veloz"
type: Opaque
# ATENÇÃO: valores abaixo são base64 de strings de EXEMPLO.
# Em produção, NUNCA commitar secrets reais. Use:
#   kubectl create secret generic loja-veloz-secrets \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     -n loja-veloz
#
# Decodificando: echo "cG9zdGdyZXM=" | base64 -d  → "postgres"
data:
  POSTGRES_USER:             cG9zdGdyZXM=          # postgres
  POSTGRES_PASSWORD:         c2VuaGFfc2VndXJh      # senha_segura
  PAGAMENTO_GATEWAY_TOKEN:   dG9rZW4tcHJvZA==      # token-prod
  GRAFANA_ADMIN_PASSWORD:    Z3JhZmFuYV9wcm9k      # grafana_prod

version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# Loja Veloz — Ambiente Local de Desenvolvimento
# Sobe todos os serviços com: docker compose up --build
# ══════════════════════════════════════════════════════════════════════════════

networks:
  loja-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

services:

  # ── Banco de Dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: loja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-loja_veloz}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - loja-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mensageria ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: loja-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    networks:
      - loja-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: loja-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT:                    3000
      PEDIDOS_SERVICE_URL:     http://pedidos:8080
      PAGAMENTOS_SERVICE_URL:  http://pagamentos:8081
      ESTOQUE_SERVICE_URL:     http://estoque:8082
      NODE_ENV:                development
    networks:
      - loja-network
    depends_on:
      pedidos:
        condition: service_healthy
      pagamentos:
        condition: service_healthy
      estoque:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Serviço de Pedidos ──────────────────────────────────────────────────────
  pedidos:
    build:
      context: ./services/pedidos
      dockerfile: Dockerfile
    container_name: loja-pedidos
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL:                    postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-loja_veloz}
      RABBITMQ_URL:                    amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT:    http://jaeger:4317
      APP_VERSION:                     1.0.0
    networks:
      - loja-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Serviço de Pagamentos ───────────────────────────────────────────────────
  pagamentos:
    build:
      context: ./services/pagamentos
      dockerfile: Dockerfile
    container_name: loja-pagamentos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PAGAMENTO_GATEWAY_URL:           ${PAGAMENTO_GATEWAY_URL:-https://sandbox.gateway.com}
      PAGAMENTO_GATEWAY_TOKEN:         ${PAGAMENTO_GATEWAY_TOKEN:-token-sandbox}
      OTEL_EXPORTER_OTLP_ENDPOINT:    http://jaeger:4317
      APP_VERSION:                     1.0.0
    networks:
      - loja-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Serviço de Estoque ──────────────────────────────────────────────────────
  estoque:
    build:
      context: ./services/estoque
      dockerfile: Dockerfile
    container_name: loja-estoque
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT:    http://jaeger:4317
      APP_VERSION:                     1.0.0
    networks:
      - loja-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Observabilidade: Jaeger (Tracing) ───────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: loja-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - loja-network

  # ── Observabilidade: Prometheus (Métricas) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: loja-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - loja-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # ── Observabilidade: Grafana (Dashboards) ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: loja-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - loja-network
    depends_on:
      - prometheus
